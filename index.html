<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado dos Gabaritos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* Tema claro: fundo branco e azul bebê. O escuro vale pelo sistema ou pelo botão da faixa de topo. */
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#1b2a3a; --muted:#566678; --line:#dbe6ef; --soft:#f0f6fb;
  --accent:#8fd0f4; --accent-hover:#79c4ee; --accent-ink:#0b2a42; --accent-soft:#e7f5fd; --accent-deep:#176a9c;
  --mast:#ffffff; --mast-line:#dbe6ef;
  --hero-bg:#e7f5fd; --hero-line:#bfe3f7;
  --ok:#1d7a2a; --ok-fill:#2dba2e; --ok-bg:#e3f4e1;
  --bad:#c42a00; --bad-fill:#e5482a; --bad-bg:#fde8e2;
  --warn:#a04f00; --warn-fill:#f0902a; --warn-bg:#fdf0e1;
  --link:#176a9c;
  --font:"Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --display:"Bricolage Grotesque","Albert Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --bg:#0e1722; --card:#152230; --ink:#e8f0f7; --muted:#9fb2c4; --line:#25384a; --soft:#1b2b3b;
    --accent:#8fd0f4; --accent-hover:#a8dbf7; --accent-ink:#0b2a42; --accent-soft:#17354a; --accent-deep:#8fd0f4;
    --mast:#0a121b; --mast-line:#1e2f40;
    --hero-bg:#17354a; --hero-line:#25506c;
    --ok:#62d36a; --ok-fill:#2dba2e; --ok-bg:#16301a;
    --bad:#ff8a70; --bad-fill:#e5482a; --bad-bg:#3a1e17;
    --warn:#f5a54a; --warn-fill:#f0902a; --warn-bg:#3a2a17;
    --link:#8fd0f4}
}
:root[data-tema="escuro"]{
  --bg:#0e1722; --card:#152230; --ink:#e8f0f7; --muted:#9fb2c4; --line:#25384a; --soft:#1b2b3b;
  --accent:#8fd0f4; --accent-hover:#a8dbf7; --accent-ink:#0b2a42; --accent-soft:#17354a; --accent-deep:#8fd0f4;
  --mast:#0a121b; --mast-line:#1e2f40;
  --hero-bg:#17354a; --hero-line:#25506c;
  --ok:#62d36a; --ok-fill:#2dba2e; --ok-bg:#16301a;
  --bad:#ff8a70; --bad-fill:#e5482a; --bad-bg:#3a1e17;
  --warn:#f5a54a; --warn-fill:#f0902a; --warn-bg:#3a2a17;
  --link:#8fd0f4}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);padding-bottom:78px}
main{max-width:760px;margin:0 auto;padding:0 16px 24px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
h1{font-size:1.3rem;line-height:1.2;margin:0;font-weight:700}
h2{font-size:1.05rem;margin:0 0 .5rem;font-weight:700}
h3{font-size:.95rem;margin:0 0 .3rem;font-weight:700}
p{margin:.4rem 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px 14px;min-height:44px;font-weight:600;font-size:.93rem;transition:border-color .15s,background .15s,transform .05s}
button:hover{border-color:var(--accent-deep)}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
select,input[type=text]{min-height:44px;padding:9px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--card);max-width:100%}
select{width:100%}
input[type=text]{width:100px}

/* faixa de topo */
.mast{background:var(--mast);border-bottom:1px solid var(--mast-line);position:sticky;top:0;z-index:30}
.mast .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.mast .sel{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 .95rem var(--display)}
.mast .tit{flex:1;min-width:0}
.mast b{display:block;font:700 1.02rem/1.15 var(--display)}
.mast small{display:block;color:var(--muted);font-size:.78rem;margin-top:1px}
.mast .luz{flex:0 0 auto;min-height:40px;padding:6px 14px;display:flex;align-items:center;gap:7px;font-size:.85rem;font-weight:700;border-radius:99px;background:var(--accent-soft);border:1.5px solid var(--accent-deep);color:var(--accent-deep)}
.mast .luz:hover{background:var(--accent);color:var(--accent-ink)}
.mast .luz svg{width:20px;height:20px}
body[data-modo="foco"] .mast{display:none}

.top{padding:18px 0 10px}
.top .brand{display:flex;flex-direction:column}
.top small{color:var(--muted);font-size:.82rem}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--mast);border-top:1px solid var(--mast-line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px 6px;min-height:52px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:8px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button:hover{border-color:transparent;color:var(--ink)}
.tabs button.on{color:var(--accent-deep)}
.tabs button.on::before{content:"";position:absolute;top:-5px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent-deep)}
@media(min-width:760px){
  body{padding-bottom:24px}
  .tabs{position:static;background:none;border:0;padding:14px 0 6px;gap:6px}
  .tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:.9rem;border:1px solid var(--line);background:var(--card)}
  .tabs button:hover{border-color:var(--accent-deep);color:var(--ink)}
  .tabs button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .tabs button.on::before{display:none}
}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:520px){.g2.q{grid-template-columns:1fr}}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font:700 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.78rem}
.cta{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;padding:13px 16px;border-radius:12px;min-height:0}
.cta strong{font:700 .98rem var(--display)}
.cta span{font-weight:400;font-size:.84rem;opacity:.85}

/* destaque do início */
.hero{background:var(--hero-bg);border:1px solid var(--hero-line);border-radius:16px;padding:20px 18px;margin:14px 0 12px}
.hero .dias{font:800 2.6rem/1 var(--display);color:var(--accent-deep);font-variant-numeric:tabular-nums}
.hero h2{font-size:1.1rem;margin:.35rem 0 .2rem}
.hero p{color:var(--muted);margin:0 0 14px;font-size:.88rem}
.hero button.pri{width:100%}

.alerta{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:11px 14px;margin:12px 0}
.alerta.bom{background:var(--ok-bg);border-color:var(--ok-fill)}
.alerta b{display:block;font-family:var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:8px 13px;min-height:40px;font-size:.86rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}

/* medidores de desempenho */
.tema{padding:12px 0;border-bottom:1px solid var(--line)}
.tema:last-child{border-bottom:0}
.tema-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tema-n{font-weight:600;font-size:.93rem}
.tema-p{font:700 1rem var(--display);font-variant-numeric:tabular-nums}
.meter{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 6px}
.meter>i{display:block;height:100%;border-radius:99px}
.tema-f{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.tema-f button{min-height:36px;padding:5px 13px;font-size:.82rem}
.sev-bad{color:var(--bad)} .sev-warn{color:var(--warn)} .sev-ok{color:var(--ok)}
.fill-bad{background:var(--bad-fill)} .fill-warn{background:var(--warn-fill)} .fill-ok{background:var(--ok-fill)}

.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-deep);border-radius:99px;transition:width .25s}

/* prova e estudo */
.sticky{position:sticky;top:0;z-index:15;background:var(--bg);padding:12px 0 8px}
.sticky .row{justify-content:space-between}
.cron{font:700 1.3rem var(--display);font-variant-numeric:tabular-nums}
.cron.low{color:var(--bad)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.nav button{width:42px;min-height:42px;padding:0;text-align:center;border-radius:10px}
.nav button.done{background:var(--accent-soft);border-color:var(--accent-deep);color:var(--accent-deep)}
.nav button.cur{outline:3px solid var(--accent);outline-offset:1px}
.enun{font-weight:600;font-size:1rem;line-height:1.5}
.enun p{margin:.5rem 0}
.opt{display:flex;gap:12px;width:100%;text-align:left;margin:9px 0;padding:12px 13px;align-items:flex-start;border-radius:12px;font-weight:400;font-size:.95rem}
.opt b{flex:0 0 1.8rem;height:1.8rem;border-radius:8px;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font:700 .82rem var(--display)}
.opt:disabled{opacity:1;cursor:default}
.opt.sel{border:2px solid var(--accent-deep);padding:11px 12px;background:var(--accent-soft)}
.opt.sel b{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok-fill);background:var(--ok-bg)} .opt.ok b{background:var(--ok-fill);color:#fff}
.opt.bad{border-color:var(--bad-fill);background:var(--bad-bg)} .opt.bad b{background:var(--bad-fill);color:#fff}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px;justify-content:space-between;flex-wrap:nowrap}
.dock .in>span{display:flex;gap:8px}
.dock button{padding:9px 13px;white-space:nowrap}
.exp{border-radius:10px;padding:10px 13px;margin-top:10px;font-weight:600;font-size:.93rem}
.okx{background:var(--ok-bg);border-left:5px solid var(--ok-fill)}
.badx{background:var(--bad-bg);border-left:5px solid var(--bad-fill)}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.why h3{margin:0 0 .3rem;font-size:.88rem}
.why p{margin:.35rem 0}
.big{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.q-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lista{width:100%;border-collapse:collapse}
.lista td,.lista th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.86rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-modo="abas">
<header class="mast"><div class="in">
  <span class="sel" aria-hidden="true">S</span>
  <div class="tit"><b>Simulado dos gabaritos</b><small>MBA Data Science e Analytics, USP/Esalq</small></div>
  <button class="luz" id="luz" type="button" aria-label="Alternar modo escuro"></button>
</div></header>
<main id="app"></main>
<script src="banco.js"></script>
<script src="app.js"></script>
</body>
</html>
